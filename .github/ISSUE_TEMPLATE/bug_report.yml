name: Bug report
description: Report a bug or crash in Fluxwright
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Rust crate
        - Node.js binding
        - Python binding
        - Server / CLI
        - MCP server
        - Cluster mode
        - Docs / Site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fluxwright version
      placeholder: "e.g. 0.9.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS & Architecture
      placeholder: "e.g. Ubuntu 24.04 x86_64, macOS 15 arm64, Windows 11 x64"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome / Chromium version
      placeholder: "e.g. Chromium 131.0.6778.85"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction steps
      description: Paste a short runnable snippet or CLI invocation that triggers the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack trace
      description: Optional error output, panic backtrace, or server logs.
      render: shell
    validations:
      required: false
