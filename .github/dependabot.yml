version: 2
# Each group takes patch and minor updates only. A major update gets a PR of its own, so one
# breaking release (napi-rs 3, Next 16) no longer holds back every safe update in its group.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /bindings/node
      - /bindings/python
    schedule:
      interval: weekly
    groups:
      bindings-rust:
        update-types: [minor, patch]
        # A pyo3 0.x "minor" release changes its API: always a PR of its own.
        exclude-patterns: ["pyo3*"]

  - package-ecosystem: npm
    directories:
      - /www
      - /benchmarks
      - /bindings/node
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
