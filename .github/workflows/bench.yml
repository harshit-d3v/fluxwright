name: benchmarks

# Run by hand: Actions → benchmarks → Run workflow. Every tool runs in one job, on one
# chrome-headless-shell, on the same machine. A GitHub runner is a shared VM, so compare tools
# within one run, not one run with another.
on:
  workflow_dispatch:
    inputs:
      run_fleet:
        description: Run 6-tool fleet comparison (Fluxwright, Crawlee, puppeteer-cluster, Playwright, Puppeteer, Selenium)
        type: boolean
        default: true
      chaos:
        description: Also kill a browser every two seconds during 1,000 jobs
        type: boolean
        default: true
      soak_minutes:
        description: Also soak for this many minutes (0 for none)
        default: "0"
      fastpath:
        description: Also run Tier 1 HTTP fast-path vs browser benchmark
        type: boolean
        default: true
      tools:
        description: Optional comma-separated tool filter (blank runs all 6 tools)
        default: ""

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: benchmarks/package-lock.json
      - name: Install Node benchmark competitors without bundled browsers
        working-directory: benchmarks
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: One chrome-headless-shell (and matching chromedriver) for every tool
        run: |
          # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs: allow them, so every
          # tool runs sandboxed, as in production.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The stable build, read from the list that carries download links: the short list that
          # `@stable` resolves through has come back empty, which fails the install.
          versions=https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json
          for attempt in 1 2 3; do
            version=$(curl -fsSL "$versions" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).channels.Stable.version") &&
              out=$(npx -y @puppeteer/browsers install "chrome-headless-shell@$version" --path "$RUNNER_TEMP/browsers") &&
              cd_out=$(npx -y @puppeteer/browsers install "chromedriver@$version" --path "$RUNNER_TEMP/browsers") && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          echo "$out"
          echo "$cd_out"
          echo "FLUXWRIGHT_CHROMIUM=$(echo "$out" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
          echo "FLUXWRIGHT_CHROMEDRIVER=$(echo "$cd_out" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
      - name: Run
        if: inputs.run_fleet
        env:
          CHAOS: ${{ inputs.chaos && '--chaos' || '' }}
          SOAK: ${{ inputs.soak_minutes != '0' && format('--soak-minutes {0}', inputs.soak_minutes) || '' }}
          TOOLS: ${{ inputs.tools != '' && format('--tools {0}', inputs.tools) || '' }}
        # Unquoted on purpose: each is one flag (with its value) or nothing.
        run: cargo run --release -p fluxwright-benchmarks -- --out bench-results $CHAOS $SOAK $TOOLS
      - name: Summary
        if: inputs.run_fleet
        run: |
          {
            echo "### Benchmarks: $(nproc) vCPU, $(free -g | awk '/Mem:/{print $2}') GB, $(date -u +%F)"
            echo
            echo "| tool | scenario | jobs | jobs/s | peak MB | jobs/s per GB | avg CPU% | peak CPU% | p50 ms | p95 ms | p99 ms | failures | browsers killed | Chrome left behind |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
            node -e "for (const r of require('./bench-results/latest.json')) console.log('| ' + [r.tool, r.scenario, r.jobs, r.jobs_per_second.toFixed(1), r.peak_memory_mb, r.jobs_per_gb.toFixed(1), (r.avg_cpu_pct ?? 0).toFixed(1) + '%', (r.peak_cpu_pct ?? 0).toFixed(1) + '%', r.p50_latency_ms ?? 0, r.p95_latency_ms, r.p99_latency_ms ?? 0, (r.failure_rate * 100).toFixed(1) + '%', r.browsers_killed, r.leaked_processes].join(' | ') + ' |')"
            echo
            echo "Memory is the driver plus every process it started, summed as RSS. CPU% is normalized against total logical host cores. Crawlee uses PlaywrightCrawler (incognito contexts, maxRequestRetries: 2, blockRequests() on scraping-200); puppeteer-cluster uses CONCURRENCY_CONTEXT (single managed browser, retryLimit: 2); selenium uses Selenium 4 WebDriver BiDi with fresh browser.createUserContext() per job; raw Playwright, Puppeteer, and Selenium runners have no relaunch/retry code in chaos."
            node -e "for (const r of require('./bench-results/latest.json')) if (r.memory_samples_mb.length) console.log(r.scenario + ' memory (MB, one a minute): ' + r.memory_samples_mb.join(', '))"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run fast-path benchmark
        if: inputs.fastpath
        run: |
          cargo build --release -p fluxwright-cli
          node benchmarks/fastpath-bench.mjs --bin target/release/fluxwright --out bench-results
      - name: Fast-path summary
        if: inputs.fastpath
        run: |
          {
            echo "### Tier 1 HTTP Fast-Path vs Browser: $(nproc) vCPU, $(free -g | awk '/Mem:/{print $2}') GB, $(date -u +%F)"
            echo
            echo "| scenario | endpoint | mode | preset | req/s | p50 ms | p95 ms | http | browser | rss MB | fail % |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            node -e "for (const r of require('./bench-results/fastpath-latest.json').scenarios) console.log('| ' + [r.scenario, r.endpoint, r.mode, r.resource_preset, r.req_per_sec.toFixed(2), r.p50_ms.toFixed(1), r.p95_ms.toFixed(1), r.engine.http, r.engine.browser, r.server_rss_mb, (r.failure_rate * 100).toFixed(1) + '%'].join(' | ') + ' |')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results/*.json
          if-no-files-found: error
