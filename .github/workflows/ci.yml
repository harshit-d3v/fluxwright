name: ci

on:
  push:
    branches: [main]
  pull_request:

# Checkout is all any job needs from the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
      FLUXWRIGHT_HEADLESS: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Locate Chrome
        run: |
          echo "FLUXWRIGHT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Test
        run: cargo test --workspace -- --test-threads=1

  # Chrome comes preinstalled on all three runners, where the engine finds it by itself.
  node:
    name: node binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node -> target
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci
      - run: npm run test:types
      - run: npm run build:debug
      - run: npm test

  python:
    name: python binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
    defaults:
      run:
        working-directory: bindings/python
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python -> target
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and test
        run: |
          python -m venv .venv
          bin=.venv/bin; [ -d .venv/Scripts ] && bin=.venv/Scripts
          "$bin/python" -m pip install maturin pytest
          VIRTUAL_ENV="$PWD/.venv" "$bin/maturin" develop
          "$bin/python" -m pytest -q tests

  site:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run build
