name: ci

on:
  push:
    branches: [main]
  pull_request:

# Checkout is all any job needs from the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
      FLUXWRIGHT_HEADLESS: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Locate Chrome
        run: |
          echo "FLUXWRIGHT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Test
        run: cargo test --workspace -- --test-threads=1

  # Chrome comes preinstalled on all three runners, where the engine finds it by itself.
  node:
    name: node binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node -> target
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci
      - run: npm run test:types
      - run: npm run build:debug
      # The build regenerates both; the loader carries the package version, so a version bump
      # that skips the rebuild would publish a loader expecting the old one.
      - name: Generated index.js and index.d.ts are committed
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- index.js index.d.ts || { echo "::error::Run npm run build:debug and commit index.js and index.d.ts"; exit 1; }
      - run: npm test

  python:
    name: python binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
    defaults:
      run:
        working-directory: bindings/python
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python -> target
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and test
        run: |
          python -m venv .venv
          bin=.venv/bin; [ -d .venv/Scripts ] && bin=.venv/Scripts
          "$bin/python" -m pip install maturin pytest
          VIRTUAL_ENV="$PWD/.venv" "$bin/maturin" develop
          "$bin/python" -m pytest -q tests

  # The image builds, and `fluxwright serve` in it runs a job end to end (against a loopback
  # page, which the SSRF guard must let through).
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fluxwright .
      - name: Run one job through fluxwright serve
        run: |
          token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          mkdir site && echo '<title>docker-ok</title>' > site/index.html
          python3 -m http.server 8000 --bind 127.0.0.1 --directory site &
          docker run -d --name fw --network host --shm-size=1g \
            -e FLUXWRIGHT_SERVER_TOKEN="$token" -e FLUXWRIGHT_NO_SANDBOX=1 \
            fluxwright serve --listen 127.0.0.1:7331
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:7331/healthz && break; sleep 1; done
          auth="Authorization: Bearer $token"
          id=$(curl -fsS -H "$auth" -H 'Content-Type: application/json' \
            -d '{"steps":[{"action":"goto","url":"http://127.0.0.1:8000/"},{"action":"title"}]}' \
            http://127.0.0.1:7331/v1/jobs | jq -r .id)
          for _ in $(seq 90); do
            job=$(curl -fsS -H "$auth" "http://127.0.0.1:7331/v1/jobs/$id")
            case $(jq -r .status <<<"$job") in succeeded|failed|cancelled) break ;; esac
            sleep 1
          done
          jq . <<<"$job"
          test "$(jq -r '.results[1]' <<<"$job")" = docker-ok
      - if: always()
        run: docker logs fw || true

  site:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: black-box e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            www/package-lock.json
            tests/e2e/package-lock.json
      - name: Locate Chrome
        run: |
          echo "FLUXWRIGHT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Build website
        working-directory: www
        run: |
          npm ci
          npm run build
      - name: Build fluxwright-cli
        run: cargo build -p fluxwright-cli
      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci
      - name: Run E2E suite
        run: node tests/e2e/run.mjs
