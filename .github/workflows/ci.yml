name: ci

on:
  push:
    branches: [main]
  pull_request:

# Checkout is all any job needs from the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
      FLUXWRIGHT_HEADLESS: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Locate Chrome
        run: |
          echo "FLUXWRIGHT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Test
        run: cargo test --workspace -- --test-threads=1

  node:
    name: node binding
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Locate Chrome
        run: echo "FLUXWRIGHT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run test:types
      - run: npm run build:debug
      - run: npm test

  python:
    name: python binding
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUXWRIGHT_NO_SANDBOX: "1"
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python -> target
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Locate Chrome
        run: echo "FLUXWRIGHT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: python -m venv .venv && .venv/bin/pip install maturin pytest
      - run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop
      - run: .venv/bin/python -m pytest -q tests

  site:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run build
