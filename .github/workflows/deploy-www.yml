name: deploy-www

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/deploy-www.yml"
  pull_request:
    paths:
      - "www/**"
      - ".github/workflows/deploy-www.yml"

concurrency:
  group: deploy-www-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: vercel
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm install -g vercel@59.20.0
      - name: Pull
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }} --cwd www
      - name: Build
        run: vercel build ${{ github.event_name == 'pull_request' && '' || '--prod' }} --token=${{ secrets.VERCEL_TOKEN }} --cwd www
      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url=$(vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }} --cwd www)
          else
            url=$(vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --cwd www)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview: ${{ steps.deploy.outputs.url }}`
            })
