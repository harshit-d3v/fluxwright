name: release-crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify packaging without publishing to crates.io"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check registry token
        id: auth
        shell: bash
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.auth.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.auth.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - if: steps.auth.outputs.skip != 'true'
        name: Publish workspace crates in dependency order
        shell: bash
        run: |
          set -euo pipefail
          crates=(
            fluxwright-cdp
            fluxwright-core
            fluxwright
            fluxwright-server
            fluxwright-cli
            fluxwright-mcp
          )

          crate_version() {
            python3 - "$1" <<'PY'
          import json, subprocess, sys
          name = sys.argv[1]
          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version=1"]))
          for pkg in meta["packages"]:
              if pkg["name"] == name:
                  print(pkg["version"])
                  sys.exit(0)
          sys.exit(1)
          PY
          }

          is_published() {
            local crate="$1" ver="$2"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: fluxwright-release-ci" "https://crates.io/api/v1/crates/${crate}/${ver}")
            [ "$code" = "200" ]
          }

          wait_for_index() {
            local crate="$1" ver="$2"
            for _ in $(seq 1 18); do
              if is_published "$crate" "$ver"; then
                # Brief extra wait for CDN / sparse-index cache invalidation.
                sleep 10
                return 0
              fi
              sleep 5
            done
            echo "::warning::Timed out waiting for ${crate}@${ver} to appear on crates.io; continuing"
          }

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: packaging all publishable workspace crates"
            cargo package --locked --workspace --exclude benchmark-server --exclude fluxwright-benchmarks --no-verify
            exit 0
          fi

          for i in "${!crates[@]}"; do
            crate="${crates[$i]}"
            ver=$(crate_version "$crate")
            if is_published "$crate" "$ver"; then
              echo "Skipping ${crate}@${ver}: already published on crates.io"
              continue
            fi

            echo "Publishing ${crate}@${ver}..."
            cargo publish --locked -p "$crate"
            if [ "$((i + 1))" -lt "${#crates[@]}" ]; then
              wait_for_index "$crate" "$ver"
            fi
          done
