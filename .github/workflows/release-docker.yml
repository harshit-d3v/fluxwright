name: Docker release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set image repository name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set image repository name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest list
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          AMD64="$(tr -d '[:space:]' < digests/amd64)"
          ARM64="$(tr -d '[:space:]' < digests/arm64)"
          ARGS=()
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            ARGS+=(-t "${IMAGE}:${TAG}" -t "${IMAGE}:${VERSION}")
            if [[ "${VERSION}" != *-* ]]; then
              ARGS+=(-t "${IMAGE}:${VERSION%.*}" -t "${IMAGE}:latest")
            fi
          else
            ARGS+=(-t "${IMAGE}:sha-${GITHUB_SHA::7}")
          fi
          docker buildx imagetools create "${ARGS[@]}" "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
