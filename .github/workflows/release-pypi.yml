name: release-pypi

# Builds the wheels and the sdist for PyPI. Publishing stays a manual step: download the
# `pypi-*` artifacts into one folder and upload them with `uvx twine upload <folder>/*`.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/python

jobs:
  wheels:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          # Built in a manylinux2014 container, so the wheel loads on glibc 2.17 and newer.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
