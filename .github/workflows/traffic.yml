name: traffic snapshot

# GitHub keeps repo traffic for 14 days only. This saves a daily copy to the
# private harshit-d3v/fluxwright-stats repo. Needs a TRAFFIC_TOKEN secret: a
# fine-grained token with read-only "Administration" on this repo (GITHUB_TOKEN
# can't read traffic) and read/write "Contents" on fluxwright-stats.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
    steps:
      - name: Check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TRAFFIC_TOKEN secret is not set, see the comment at the top of traffic.yml"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          repository: harshit-d3v/fluxwright-stats
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Save today's traffic
        run: |
          dir="traffic/$(date -u +%F)"
          mkdir -p "$dir"
          for p in views clones popular/referrers popular/paths; do
            gh api "repos/$GITHUB_REPOSITORY/traffic/$p" > "$dir/${p#popular/}.json"
          done

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic
          git diff --cached --quiet || git commit -m "traffic: $(date -u +%F)"
          git push
