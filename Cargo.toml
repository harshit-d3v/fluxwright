[workspace]
resolver = "2"
members = [
    "crates/fluxwright-cdp",
    "crates/fluxwright-core",
    "crates/fluxwright",
    "crates/fluxwright-cli",
    "crates/fluxwright-mcp",
    "crates/fluxwright-server",
    "benchmark-server",
    "benchmarks",
]
exclude = ["bindings/node", "bindings/python"]

[workspace.package]
version = "0.14.0"
authors = ["Harshit Prakash"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/harshit-d3v/fluxwright"
rust-version = "1.95"
homepage = "https://fluxwright.vercel.app"
keywords = ["chromium", "cdp", "browser", "automation", "headless"]
categories = ["web-programming", "asynchronous"]

[workspace.dependencies]
fluxwright-cdp = { path = "crates/fluxwright-cdp", version = "0.14.0" }
fluxwright-core = { path = "crates/fluxwright-core", version = "0.14.0" }
fluxwright = { path = "crates/fluxwright", version = "0.14.0" }
fluxwright-server = { path = "crates/fluxwright-server", version = "0.14.0" }
benchmark-server = { path = "benchmark-server" }

tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# ring, not the default aws-lc-rs: aws-lc needs cmake and nasm on Windows builders.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1.0"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tempfile = "3.13"
sysinfo = "0.39"
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
anyhow = "1.0"
base64 = "0.23"
png = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = { version = "0.29", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
url = "2.5"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
