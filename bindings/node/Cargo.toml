[package]
name = "fluxwright-node"
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fluxwright = { path = "../../crates/fluxwright" }
napi = { version = "3.14", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "3.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
