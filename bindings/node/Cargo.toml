[package]
name = "fluxwright-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fluxwright = { path = "../../crates/fluxwright" }
napi = { version = "2.16", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
once_cell = "1.20"
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"
