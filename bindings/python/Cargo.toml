[package]
name = "fluxwright-python"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
fluxwright = { path = "../../crates/fluxwright" }
fluxwright-cdp = { path = "../../crates/fluxwright-cdp" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
