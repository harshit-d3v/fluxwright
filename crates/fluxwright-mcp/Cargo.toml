[package]
name = "fluxwright-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for Fluxwright (Claude, Codex, Cursor)"
rust-version = "1.88" # rmcp 3.5; the other crates keep the workspace 1.85

[[bin]]
name = "fluxwright-mcp"
path = "src/main.rs"

[dependencies]
fluxwright.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
